name: CS
options:
  bundleIdPrefix: com.injoon5
  deploymentTarget:
    iOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: Q3V6F4PZ8J  # Personal Team (free provisioning)
    CODE_SIGN_STYLE: Automatic
packages:
  CSKit:
    path: Packages/CSKit
targets:
  CS:
    type: application
    platform: iOS
    sources:
      - path: CS
        type: syncedFolder
      # Copied by "Process Python libraries" into CS.app/python, next to the stdlib.
      # A resources phase would replace that folder and drop the stdlib.
      - path: Resources/python
        type: folder
        buildPhase: none
      # Lessons, exercises, cards and recorded outputs, loaded at launch from CS.app/content.
      - path: content
        type: folder
        buildPhase: resources
    dependencies:
      - package: CSKit
        products: [CSKit]
      # Fetched by tools/fetch_python.sh (gitignored).
      - framework: Frameworks/Python.xcframework
        embed: true
        codeSign: true
    postCompileScripts:
      # https://docs.python.org/3.14/using/ios.html: copy the stdlib into the bundle and
      # turn each extension module into a signed framework, before Embed Frameworks.
      # Also copies the app's own Python (Resources/python) into CS.app/python.
      - name: Process Python libraries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          XCFRAMEWORK="Frameworks/Python.xcframework"
          if [ ! -f "$PROJECT_DIR/$XCFRAMEWORK/build/utils.sh" ]; then
              echo "error: $XCFRAMEWORK is missing. Run tools/fetch_python.sh."
              exit 1
          fi
          source "$PROJECT_DIR/$XCFRAMEWORK/build/utils.sh"

          install_stdlib "$XCFRAMEWORK"
          PYTHON_VER=$(ls -1 "$CODESIGNING_FOLDER_PATH/python/lib" | grep -E "^python3\.[0-9]+$")
          STDLIB="$CODESIGNING_FOLDER_PATH/python/lib/$PYTHON_VER"

          # Unused by the app: tests, IDLE, Tk, and the CPython test extension modules.
          rm -rf "$STDLIB/test" "$STDLIB/idlelib" "$STDLIB/tkinter" "$STDLIB/turtledemo"
          find "$STDLIB/lib-dynload" \( -name "_test*.so" -o -name "_ctypes_test.*" \
              -o -name "_xxtestfuzz.*" -o -name "xxlimited*" -o -name "xxsubtype.*" \) -delete

          process_dylibs "$XCFRAMEWORK" "python/lib/$PYTHON_VER/lib-dynload"

          rsync -a --delete --exclude "/lib/" --exclude ".gitkeep" --exclude "__pycache__" \
              --exclude ".pytest_cache" --exclude "test_*.py" --exclude "/tests/" --exclude "conftest.py" \
              "$PROJECT_DIR/Resources/python/" "$CODESIGNING_FOLDER_PATH/python/"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_TESTABILITY: YES
        HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.injoon5.cs
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: CS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
schemes:
  CS:
    build:
      targets:
        CS: all
    test:
      targets: []
